version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: Greenweez ham verileri
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: Siparişlerin satır bazlı satış verileri
        tests:
          - unique:
              column_name: "(orders_id || '-' || pdt_id)"
        columns:
          - name: date_date
            description: Satış tarihi
          - name: orders_id
            description: Sipariş kimlik numarası
          - name: pdt_id
            description: Ürün kimlik numarası
          - name: revenue
            description: Satıştan elde edilen gelir
          - name: quantity
            description: Satılan ürün adedi

      - name: product
        identifier: raw_gz_product
        description: Ürün kataloğu ve maliyet bilgileri
        columns:
          - name: products_id
            description: Benzersiz ürün kimlik numarası
            tests:
              - unique
              - not_null
          - name: purchase_price
            description: Ürünün alış maliyeti

      - name: ship
        identifier: raw_gz_ship
        description: Kargo ve teslimat verileri
        columns:
          - name: orders_id
            description: Benzersiz sipariş kimlik numarası
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: Müşteriden alınan kargo ücreti
          - name: shipping_fee_1
            description: Müşteriden alınan mükerrer kargo ücreti sütunu
          - name: logcost
            description: Lojistik operasyon maliyeti
          - name: ship_cost
            description: Kargo şirketine ödenen maliyet

      - name: adwords
        identifier: raw_gz_adwords
      - name: bing
        identifier: raw_gz_bing
      - name: criteo
        identifier: raw_gz_criteo
      - name: facebook
        identifier: raw_gz_facebook

models:
  - name: int_campaigns
    description: Dört farklı reklam kanalından birleştirilmiş kampanya verileri
    tests:
      - unique:
          column_name: "(date_date || '_' || paid_source || '_' || campaign_name)"
    columns:
      - name: date_date
        description: Kampanya tarihi
        tests:
          - not_null
      - name: paid_source
        description: Reklam platformu adı
        tests:
          - not_null
      - name: campaign_name
        description: Reklam kampanya adı
        tests:
          - not_null
      - name: ads_cost
        description: Kampanya harcama maliyeti
        tests:
          - not_null

  - name: int_campaigns_day
    description: Gün bazında toplanmış reklam maliyeti, gösterim ve tıklama verileri
    columns:
      - name: date_date
        description: Kampanya tarihi (Birincil Anahtar)
        tests:
          - unique
          - not_null
      - name: ads_cost
        description: Günlük toplam reklam maliyeti
        tests:
          - not_null
      - name: ads_impression
        description: Günlük toplam gösterim adedi
        tests:
          - not_null
      - name: ads_clicks
        description: Günlük toplam tıklama adedi
        tests:
          - not_null

  - name: finance_campaigns_day
    description: Günlük reklam harcamaları ve operasyonel finans marjlarını birleştiren rapor
    columns:
      - name: date
        description: Raporlama tarihi
        tests:
          - unique
          - not_null
      - name: ads_margin
        description: Reklam sonrası net marj (operational_margin - ads_cost)
        tests:
          - not_null

  - name: finance_campaigns_month
    description: Aylık reklam harcamaları ve operasyonel finans marjlarını birleştiren rapor
    columns:
      - name: datemonth
        description: Raporlama ayı
        tests:
          - unique
          - not_null
      - name: ads_margin
        description: Aylık net reklam marjı
        tests:
          - not_null